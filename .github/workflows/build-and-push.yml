name: Build and Push Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8s-autoscaling-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/k8s-autoscaling-demo:${{ github.sha }}

      # ArgoCD auto-syncs from the Helm chart's `image.tag` value. Bumping it
      # here (rather than relying on `latest`, which ArgoCD won't detect as
      # a change) is what actually triggers a new deployment via GitOps.
      - name: Update Helm chart image tag
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" helm-chart/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm-chart/values.yaml
          git commit -m "Bump image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
